name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Format, vet, build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Create Go workspace
        run: |
          go work init . ./codjent ./providers/anthropic ./providers/google ./providers/openai ./examples/google ./stores/postgres ./stores/sqlite

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet, build, and test all modules
        run: |
          for dir in . providers/anthropic providers/google providers/openai examples/google stores/sqlite stores/postgres codjent; do
            echo "== $dir =="
            (cd "$dir" && go vet ./... && go build ./... && go test -race ./...)
          done

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0
          args: ./... ./providers/anthropic/... ./providers/google/... ./providers/openai/... ./examples/google/... ./stores/postgres/... ./stores/sqlite/... ./codjent/...

  frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: codjent/frontend/pnpm-lock.yaml

      - name: Install
        working-directory: codjent/frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: codjent/frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Verify committed embedded assets are current
        run: test -z "$(git status --porcelain -- codjent/frontend/out)"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gojent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Run the storage conformance suite against PostgreSQL
        env:
          GOJENT_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/gojent_test?sslmode=disable
        working-directory: stores/postgres
        run: go test -race ./...
