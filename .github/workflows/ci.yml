name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Format, vet, build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.8.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run checks
        run: |
          just workspace
          just check

  frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: codjent/frontend/pnpm-lock.yaml

      - name: Install
        working-directory: codjent/frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: just --justfile codjent/justfile frontend

      - name: Verify committed embedded assets are current
        run: test -z "$(git status --porcelain -- codjent/frontend/out)"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gojent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Run the storage conformance suite against PostgreSQL
        env:
          GOJENT_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/gojent_test?sslmode=disable
        run: just --justfile stores/postgres/justfile test-integration
