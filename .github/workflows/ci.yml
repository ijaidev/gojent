name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Check formatting
        run: just fmt-check

  tidy:
    name: Tidy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Check module tidiness
        run: just tidy-check

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Run go vet
        run: just vet

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Build every module
        run: just build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.8.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: just lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Run unit tests
        run: just test

  frontend:
    name: codjent/frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: codjent/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: codjent/frontend
        run: pnpm install --frozen-lockfile

      - name: Build and verify committed export
        run: just --justfile codjent/justfile frontend-check

  postgres-store-integration:
    name: stores/postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gojent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Run stores/postgres integration tests
        env:
          GOJENT_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/gojent_test?sslmode=disable
        run: just --justfile stores/postgres/justfile test-integration
